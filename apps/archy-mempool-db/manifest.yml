app:
  id: archy-mempool-db
  name: Mempool MariaDB
  version: 11.4.10
  # Where this app comes from, so scripts/check-upstream-releases.py can
  # tell us when the pin below has fallen behind. Without it nothing can:
  # container.image names our mirror, not the project it was mirrored from.
  upstream:
    kind: dockerhub
    repo: library/mariadb
  description: MariaDB backend for the mempool explorer stack.

  container:
    image: source.archipelago-foundation.org/lfg2025/mariadb:11.4.10
    pull_policy: if-not-present
    network: archy-net
    data_uid: "100998:100998"
    secret_env:
      - key: MYSQL_PASSWORD
        secret_file: mempool-db-password
      - key: MYSQL_ROOT_PASSWORD
        secret_file: mysql-root-db-password

  dependencies:
    - storage: 20Gi

  resources:
    memory_limit: 512Mi
    disk_limit: 20Gi

  security:
    capabilities: [CHOWN, FOWNER, SETUID, SETGID, DAC_OVERRIDE]
    readonly_root: false
    network_policy: isolated

  ports: []

  volumes:
    - type: bind
      source: /var/lib/archipelago/mysql-mempool
      target: /var/lib/mysql
      options: [rw]

  environment:
    - MYSQL_DATABASE=mempool
    - MYSQL_USER=mempool

  health_check:
    type: tcp
    endpoint: localhost:3306
    interval: 30s
    timeout: 5s
    retries: 3

  bitcoin_integration:
    rpc_access: none
    sync_required: false
