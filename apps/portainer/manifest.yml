app:
  id: portainer
  name: Portainer
  version: 2.45.0
  # Where this app comes from, so scripts/check-upstream-releases.py can
  # tell us when the pin below has fallen behind. Without it nothing can:
  # container.image names our mirror, not the project it was mirrored from.
  upstream:
    kind: github
    repo: portainer/portainer
  description: Container management web UI for the local Podman socket.
  category: development

  container:
    image: source.archipelago-foundation.org/lfg2025/portainer:2.45.0
    pull_policy: if-not-present
    # Portainer fetches Git sources and images from services on this same node.
    # Rootless pasta copies the host LAN address into its namespace, so a LAN
    # URL points back at Portainer itself. Give it a private address with the
    # supported rootless slirp backend; public app URLs still traverse the gate.
    network: slirp4netns
    data_uid: "1000:1000"

  # Snapshot state before an upgrade recreates this app with new networking.
  backup_on_network_change: true

  dependencies:
    - storage: 1Gi

  resources:
    memory_limit: 256Mi
    disk_limit: 1Gi

  security:
    capabilities: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    readonly_root: false
    no_new_privileges: true
    network_policy: isolated

  ports:
    - host: 9000
      container: 9000
      protocol: tcp
      bind: 127.0.0.1
      auth: gated

  volumes:
    - type: bind
      source: /var/lib/archipelago/portainer
      target: /data
      options: [rw]
    - type: bind
      source: /var/lib/archipelago/portainer/compose
      target: /data/compose
      options: [rw]
    - type: bind
      source: /run/user/1000/podman/podman.sock
      target: /var/run/docker.sock
      options: [rw]

  environment: []

  interfaces:
    main:
      name: Web UI
      description: Portainer web interface
      type: ui
      port: 9000
      protocol: http
      path: /

  metadata:
    icon: /assets/img/app-icons/portainer.webp
    tier: optional
    launch:
      open_in_new_tab: true
    features:
      - Container management dashboard
      - Local Podman socket access
      - Compose stack storage
