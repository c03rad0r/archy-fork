app:
  id: vaultwarden
  name: Vaultwarden
  version: 1.30.0
  # Where this app comes from, so scripts/check-upstream-releases.py can
  # tell us when the pin below has fallen behind. Without it nothing can:
  # container.image names our mirror, not the project it was mirrored from.
  upstream:
    kind: github
    repo: dani-garcia/vaultwarden
  description: Self-hosted password vault with zero-knowledge encryption.

  container:
    image: source.archipelago-foundation.org/lfg2025/vaultwarden:1.37.1-alpine
    pull_policy: if-not-present
    network: pasta

  dependencies:
    - storage: 1Gi

  resources:
    memory_limit: 256Mi
    disk_limit: 1Gi

  security:
    capabilities: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    readonly_root: false
    network_policy: isolated

  ports:
    - host: 8082
      container: 80
      protocol: tcp
      bind: 127.0.0.1
      auth: gated

  volumes:
    - type: bind
      source: /var/lib/archipelago/vaultwarden
      target: /data
      options: [rw]

  environment: []

  health_check:
    type: tcp
    endpoint: localhost:80
    interval: 30s
    timeout: 5s
    retries: 3

  interfaces:
    main:
      name: Web UI
      description: Vaultwarden web vault
      type: ui
      port: 8082
      protocol: http
      path: /

  metadata:
    icon: /assets/img/app-icons/vaultwarden.webp
    category: data
    tier: recommended
    author: Vaultwarden
    repo: https://github.com/dani-garcia/vaultwarden
    launch:
      open_in_new_tab: true
