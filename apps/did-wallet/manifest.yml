app:
  id: did-wallet
  name: Web5 DID Wallet
  version: 1.0.0
  description: Web5 wallet with Decentralized Identifier (DID) support. Manage your digital identity and Web5 assets.
  
  container:
    image: archipelago/did-wallet:1.0.0
    image_signature: cosign://...
    pull_policy: if-not-present
    
  dependencies:
    - storage: 2Gi
    
  resources:
    cpu_limit: 1
    memory_limit: 512Mi
    disk_limit: 2Gi
    
  security:
    capabilities: []
    readonly_root: true
    no_new_privileges: true
    user: 1000
    seccomp_profile: default
    network_policy: isolated
    apparmor_profile: did-wallet
    
  ports:
    - host: 8088
      container: 8080
      protocol: tcp  # Web UI
      bind: 127.0.0.1
      auth: gated
    
  volumes:
    - type: bind
      source: /var/lib/archipelago/did-wallet
      target: /app/wallet
      options: [rw]
      
  environment:
    - WALLET_STORAGE=/app/wallet
    
  health_check:
    type: http
    endpoint: http://127.0.0.1:8080
    path: /health
    interval: 30s
    timeout: 5s
    retries: 3
    
  web5_integration:
    did_support: true
    wallet_functionality: true
    bitcoin_integration: true
