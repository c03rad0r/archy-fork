app:
  id: homeassistant
  name: Home Assistant
  version: 2026.8.3
  # Where this app comes from, so scripts/check-upstream-releases.py can
  # tell us when the pin below has fallen behind. Without it nothing can:
  # container.image names our mirror, not the project it was mirrored from.
  upstream:
    kind: github
    repo: home-assistant/core
  description: Open source home automation platform. Control and monitor your smart home devices.
  
  container:
    image: source.archipelago-foundation.org/lfg2025/home-assistant:2026.8.3
    pull_policy: if-not-present
    network: pasta
    
  dependencies:
    - storage: 10Gi
    
  resources:
    cpu_limit: 2
    memory_limit: 512Mi
    disk_limit: 10Gi
    
  security:
    capabilities: [CHOWN, FOWNER, SETUID, SETGID, DAC_OVERRIDE, NET_BIND_SERVICE, NET_RAW]
    readonly_root: false  # Home Assistant needs write access
    no_new_privileges: true
    user: 1000
    seccomp_profile: default
    network_policy: isolated
    apparmor_profile: home-assistant
    
  ports:
    - host: 8123
      container: 8123
      protocol: tcp  # Web UI
      bind: 127.0.0.1
      auth: gated
    
  volumes:
    - type: bind
      source: /var/lib/archipelago/home-assistant
      target: /config
      options: [rw]
      
  devices: []
    
  environment:
    - TZ=UTC
    
  health_check:
    type: tcp
    endpoint: localhost:8123
    interval: 30s
    timeout: 5s
    retries: 3

  interfaces:
    main:
      name: Web UI
      description: Home Assistant dashboard
      type: ui
      port: 8123
      protocol: http
      path: /

  metadata:
    icon: /assets/img/app-icons/homeassistant.png
    category: home
    author: Home Assistant
    repo: https://github.com/home-assistant/core
    launch:
      open_in_new_tab: true
