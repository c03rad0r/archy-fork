# Shorty repair 2026-10-01: NPM host 2, certificate 8.
# Replace through durable NPM integration migration once released.
server {
    listen 80;
    listen [::]:80;
    server_name fixture.example;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/lib/archipelago/nginx-proxy-manager/letsencrypt-acme-challenge;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fixture.example;
    ssl_certificate /var/lib/archipelago/nginx-proxy-manager/letsencrypt/live/npm-8/fullchain.pem;
    ssl_certificate_key /var/lib/archipelago/nginx-proxy-manager/letsencrypt/live/npm-8/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4m;
    location / {
        proxy_pass http://127.0.0.1:8998;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
