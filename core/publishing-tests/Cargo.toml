[package]
name = "archipelago-publishing-tests"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true

[dependencies]
anyhow = "1.0"
chrono = "0.4"
hyper = { version = "0.14", features = ["full", "http1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.10"
